<!doctype html>
<html lang="{{ page.lang | default: 'es' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include social-article-header.html %}
    <link href="{{ '/assets/css/style.css' | relative_url }}" rel="stylesheet">
  </head>
  <body>
    <a class="skip-link" href="#main">{% if page.lang == 'en' %}Skip to content{% else %}Saltar al contenido{% endif %}</a>
    <div class="site-shell">
      {% include site-header.html %}
      <main id="main" class="page-main">{{ content }}</main>
      {% include site-footer.html %}
    </div>
    <script>
      document.addEventListener('keydown', function (event) {
        if (event.key !== 'Escape') return;
        var menu = document.querySelector('.site-menu[open]');
        if (!menu) return;
        menu.removeAttribute('open');
        menu.querySelector('summary').focus();
      });
    </script>
    <script>
      var _paq = window._paq = window._paq || [];
      _paq.push(['trackPageView']);
      _paq.push(['enableLinkTracking']);
      (function() {
        var u='//m.logico.com.ar/';
        _paq.push(['setTrackerUrl', u+'matomo.php']);
        _paq.push(['setSiteId', '4']);
        var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
        g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
      })();
    </script>
  </body>
</html>
